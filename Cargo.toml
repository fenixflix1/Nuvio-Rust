[workspace]
resolver = "2"
members = [
    "crates/nuvio-storage",
    "crates/nuvio-supabase",
    "crates/nuvio-integrations",
    "crates/nuvio-plugins",
    "crates/nuvio-p2p",
    "crates/nuvio-core",
    "apps/nuvio-desktop",
]

[workspace.package]
version = "0.0.6"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1.54", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "form", "gzip", "deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2.5"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6.0"
rusqlite = { version = "0.43", features = ["bundled"] }
redb = "5.0"
scraper = "0.29"
rquickjs = "0.14"
libloading = "0.9"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
async-trait = "0.1"
