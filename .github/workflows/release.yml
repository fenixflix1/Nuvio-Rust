name: Build Nuvio Desktop (Rust)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libmpv-dev libx11-dev libxtst-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p nuvio-desktop
      - name: Package AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/nuvio-desktop AppDir/usr/bin/nuvio-desktop
          cp apps/nuvio-desktop/icons/icon.png AppDir/nuvio-desktop.png
          cp apps/nuvio-desktop/icons/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/nuvio-desktop.png
          cat > AppDir/nuvio-desktop.desktop <<'EOF'
          [Desktop Entry]
          Name=Nuvio
          Exec=nuvio-desktop
          Icon=nuvio-desktop
          Type=Application
          Categories=AudioVideo;Video;Player;
          EOF
          cp AppDir/nuvio-desktop.desktop AppDir/usr/share/applications/nuvio-desktop.desktop
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/nuvio-desktop" "$@"
          EOF
          chmod +x AppDir/AppRun AppDir/usr/bin/nuvio-desktop
          curl -fsSL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool AppDir NuvioDesktop-Rust-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: NuvioDesktop-Rust-Linux-AppImage
          path: NuvioDesktop-Rust-x86_64.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch Windows libmpv runtime
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          $headers = @{ "User-Agent" = "nuvio-desktop-ci" }
          if ($env:GITHUB_TOKEN) {
            $headers["Authorization"] = "Bearer $($env:GITHUB_TOKEN)"
          }
          $downloadUrl = $null
          try {
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
            $asset = $rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d+.*\.7z$' -and $_.name -notmatch 'v3' } | Select-Object -First 1
            if (-not $asset) {
              $asset = $rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-.*\.7z$' } | Select-Object -First 1
            }
            if ($asset) { $downloadUrl = $asset.browser_download_url }
          } catch {
            Write-Warning "GitHub API request failed ($($_.Exception.Message)); falling back to release web page."
            $latestResp = Invoke-WebRequest -Uri "https://github.com/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers @{ "User-Agent" = "nuvio-desktop-ci" }
            $finalUri = $latestResp.BaseResponse.RequestMessage.RequestUri.AbsoluteUri
            $tag = ($finalUri.TrimEnd('/') -split '/')[-1]
            $assetsHtml = (Invoke-WebRequest -Uri "https://github.com/shinchiro/mpv-winbuild-cmake/releases/expanded_assets/$tag" -Headers @{ "User-Agent" = "nuvio-desktop-ci" }).Content
            $paths = [regex]::Matches($assetsHtml, '/shinchiro/mpv-winbuild-cmake/releases/download/[^"''\s]+') | ForEach-Object { $_.Value } | Select-Object -Unique
            $matchPath = $paths | Where-Object { ($_ -split '/')[-1] -match '^mpv-dev-x86_64-\d+.*\.7z$' -and ($_ -split '/')[-1] -notmatch 'v3' } | Select-Object -First 1
            if (-not $matchPath) {
              $matchPath = $paths | Where-Object { ($_ -split '/')[-1] -match '^mpv-dev-x86_64-.*\.7z$' } | Select-Object -First 1
            }
            if ($matchPath) { $downloadUrl = "https://github.com$matchPath" }
          }
          if (-not $downloadUrl) { throw "Could not find mpv-dev-x86_64 archive in shinchiro/mpv-winbuild-cmake releases" }
          Invoke-WebRequest -Uri $downloadUrl -OutFile "$env:TEMP\mpv-dev.7z"
          7z e "$env:TEMP\mpv-dev.7z" "libmpv-2.dll" -o"dist-win" -r -y
          if (-not (Test-Path "dist-win\libmpv-2.dll")) { throw "libmpv-2.dll extraction failed" }
      - name: Build Windows release executable
        env:
          NUVIO_EMBED_LIBMPV_PATH: ${{ github.workspace }}\dist-win\libmpv-2.dll
        run: cargo build --release -p nuvio-desktop
      - name: Prepare Windows artifact
        shell: pwsh
        run: |
          Copy-Item target/release/nuvio-desktop.exe dist-win/NuvioDesktop-Rust.exe
      - uses: actions/upload-artifact@v4
        with:
          name: NuvioDesktop-Rust-Windows-Exe
          path: dist-win/NuvioDesktop-Rust.exe

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/NuvioDesktop-Rust-x86_64.AppImage
            release-assets/NuvioDesktop-Rust.exe
