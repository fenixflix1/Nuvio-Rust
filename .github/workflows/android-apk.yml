name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libclang-dev pkg-config libssl-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-34 build-tools;34.0.0 platform-tools ndk;27.0.11902837

      - name: Set up Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI v2
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Initialize Tauri Android project
        working-directory: apps/nuvio-desktop
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.11902837
        run: |
          cargo tauri android init --ci
          MANIFEST="gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST"
          fi

      - name: Build Universal Android APK
        working-directory: apps/nuvio-desktop
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.11902837
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android: --target=aarch64-linux-android24 --sysroot=${{ env.ANDROID_HOME }}/ndk/27.0.11902837/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi: --target=armv7a-linux-androideabi24 --sysroot=${{ env.ANDROID_HOME }}/ndk/27.0.11902837/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          BINDGEN_EXTRA_CLANG_ARGS_i686_linux_android: --target=i686-linux-android24 --sysroot=${{ env.ANDROID_HOME }}/ndk/27.0.11902837/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android: --target=x86_64-linux-android24 --sysroot=${{ env.ANDROID_HOME }}/ndk/27.0.11902837/toolchains/llvm/prebuilt/linux-x86_64/sysroot
        run: |
          cargo tauri android build --apk
          mkdir -p ../../dist-apk/raw
          RAW_UNI=$(find gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          test -n "$RAW_UNI"
          cp "$RAW_UNI" ../../dist-apk/raw/universal.apk
          rm -rf gen/android/app/build/outputs/apk

      - name: Build aarch64-only Android APK
        working-directory: apps/nuvio-desktop
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.11902837
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android: --target=aarch64-linux-android24 --sysroot=${{ env.ANDROID_HOME }}/ndk/27.0.11902837/toolchains/llvm/prebuilt/linux-x86_64/sysroot
        run: |
          cargo tauri android build --apk --target aarch64
          RAW_ARM64=$(find gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          test -n "$RAW_ARM64"
          cp "$RAW_ARM64" ../../dist-apk/raw/arm64.apk

      - name: Align and sign APKs
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ZIPALIGN="${ANDROID_HOME}/build-tools/34.0.0/zipalign"
          APKSIGNER="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
            KS="/tmp/release.keystore"
            PASS="${KEYSTORE_PASS}"
            ALIAS="${KEY_ALIAS:-nuvio}"
          else
            keytool -genkey -v -keystore /tmp/ci-debug.keystore -storepass android -alias nuvioci -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nuvio,O=Nuvio,C=BR"
            KS="/tmp/ci-debug.keystore"
            PASS="android"
            ALIAS="nuvioci"
          fi
          "$ZIPALIGN" -f 4 dist-apk/raw/universal.apk dist-apk/Nuvio-Android-universal.apk
          "$APKSIGNER" sign --ks "$KS" --ks-pass "pass:${PASS}" --ks-key-alias "$ALIAS" dist-apk/Nuvio-Android-universal.apk
          "$ZIPALIGN" -f 4 dist-apk/raw/arm64.apk dist-apk/Nuvio-Android-arm64.apk
          "$APKSIGNER" sign --ks "$KS" --ks-pass "pass:${PASS}" --ks-key-alias "$ALIAS" dist-apk/Nuvio-Android-arm64.apk
          rm -rf dist-apk/raw

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Android-APKs
          path: |
            dist-apk/Nuvio-Android-universal.apk
            dist-apk/Nuvio-Android-arm64.apk

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-apk/Nuvio-Android-universal.apk
            dist-apk/Nuvio-Android-arm64.apk
